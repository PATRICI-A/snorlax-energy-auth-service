spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:woodpecker.rmq.cloudamqp.com}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME:thjdybjd}
    password: ${RABBITMQ_PASSWORD:eHWjGdLhNYN73Ct96wUAV1KkpwnDiKZj}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:thjdybjd}
    ssl:
      enabled: ${RABBITMQ_SSL:true}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters}
  expiration: ${JWT_EXPIRATION:900000}

user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    use-root-path: true
  servers:
    - url: ${SERVER_URL:http://localhost:8080}
