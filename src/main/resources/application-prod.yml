spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

user:
  service:
    url: ${USER_SERVICE_URL}

springdoc:
  swagger-ui:
    use-root-path: true
  servers:
    - url: ${SERVER_URL:https://patricia-api-gateway-prod.ambitiousocean-47ea546c.eastus.azurecontainerapps.io}
