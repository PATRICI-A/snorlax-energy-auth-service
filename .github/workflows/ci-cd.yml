name: CI/CD – PATRICIA Auth Service

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '21'

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 – CI: Build, Tests y SonarCloud
  # ═══════════════════════════════════════════════════════════════════════════
  build-test-analyze:
    name: "CI – Build, Test & SonarCloud"
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build, Test & SonarCloud analysis
        env:
          SONAR_TOKEN:            ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET:             ${{ secrets.JWT_SECRET_TEST }}
          JWT_EXPIRATION:         '900000'
          REDIS_HOST:             localhost
          REDIS_PORT:             '6379'
          USER_SERVICE_URL:       'http://localhost:8099'
          MAIL_DEV_MODE:          'true'
          MAIL_USERNAME:          'ci-noreply@example.com'
          MAIL_PASSWORD:          'dummy-ci-password'
          SPRING_PROFILES_ACTIVE: dev
        run: |
          mvn clean verify -B

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      # Sube el JAR como artefacto para que el job de deploy lo descargue
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: target/auth-service-*.jar
          retention-days: 14


  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 – Deploy: Sube el JAR directamente al Azure App Service
  # Solo en push a main, después de build-test-analyze.
  # No requiere Docker ni Container Registry.
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-to-azure:
    name: "Deploy – Azure App Service"
    runs-on: ubuntu-latest
    needs: build-test-analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Compila solo el JAR (sin tests, ya se ejecutaron en Job 1)
      - name: Build JAR (skip tests)
        run: mvn package -DskipTests -B

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Despliega el JAR directamente al App Service
      - name: Deploy JAR to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          package:  target/auth-service-*.jar

      - name: Show deployed URL
        run: |
          echo "Deploy exitoso"
          echo "  API:     https://${{ secrets.AZURE_APP_SERVICE_NAME }}.azurewebsites.net/api/v1/auth"
          echo "  Swagger: https://${{ secrets.AZURE_APP_SERVICE_NAME }}.azurewebsites.net"
