name: CI/CD – PATRICIA Auth Service

# ─── TRIGGERS ────────────────────────────────────────────────────────────────
# Push directo a las ramas principales y Pull Requests apuntando a ellas.
# fetch-depth: 0 en el checkout es obligatorio para que SonarQube pueda
# comparar la rama actual con la base y calcular "new code".
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

env:
  JAVA_VERSION: '21'

# ─── JOBS ─────────────────────────────────────────────────────────────────────
jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 – CI: Compilar y ejecutar todos los tests
  #
  # Ejecuta en PUSH y en PULL REQUEST.
  # Produce tres artefactos: JAR, reporte JaCoCo HTML/XML, Surefire XML.
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: "CI – Build & Test (JDK 21)"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      # fetch-depth: 0 descarga el historial completo de commits.
      # SonarQube lo necesita para el análisis de ramas incremental.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 21 + caché Maven ──────────────────────────────────────────
      # actions/setup-java con cache: maven guarda ~/.m2/repository entre
      # ejecuciones usando el pom.xml como clave de caché.
      # En builds limpios ahorra ~2–3 min de descarga de dependencias.
      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # ── 3. mvn clean verify ───────────────────────────────────────────────
      # `verify` ejecuta en orden: compile → test (Surefire) → verify.
      # El plugin JaCoCo (añadido al pom.xml) se engancha a las fases
      # test y verify para instrumentar el bytecode y generar el reporte.
      #
      # Variables de entorno:
      #   MONGO_URI_TEST   → secret de GitHub apuntando a un cluster de
      #                      pruebas en Atlas (distinto del de producción).
      #   MAIL_DEV_MODE    → 'true' evita que el EmailSenderAdapter envíe
      #                      correos reales durante los tests.
      #   JWT_SECRET_TEST  → puede ser cualquier cadena ≥ 32 chars en CI.
      #
      # NOTA: Si prefieres no depender de Atlas en CI, añade la dependencia
      # de Flapdoodle Embedded MongoDB (scope test) en el pom.xml:
      #   de.flapdoodle.embed:de.flapdoodle.embed.mongo:4.13.0
      # y Spring Boot levantará un MongoDB embebido automáticamente.
      - name: Run mvn clean verify
        env:
          MONGO_URI:              ${{ secrets.MONGO_URI_TEST }}
          JWT_SECRET:             ${{ secrets.JWT_SECRET_TEST }}
          JWT_EXPIRATION:         '900000'
          MAIL_DEV_MODE:          'true'
          MAIL_USERNAME:          'ci-noreply@example.com'
          MAIL_PASSWORD:          'dummy-ci-password'
          SPRING_PROFILES_ACTIVE: dev
        run: mvn clean verify -B

      # ── 4. Artefacto: reporte de cobertura JaCoCo ─────────────────────────
      # `if: always()` sube el reporte incluso si los tests fallan,
      # para poder analizar qué líneas se ejecutaron antes del fallo.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      # ── 5. Artefacto: reportes XML de Surefire ────────────────────────────
      # GitHub Actions puede interpretar estos XMLs en la pestaña "Tests"
      # del resumen del workflow con la action mikepenz/action-junit-report.
      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      # ── 6. Artefacto: JAR ejecutable ─────────────────────────────────────
      # El JAR generado por Spring Boot (fat jar) se conserva para
      # descarga manual o para usarlo en un job de despliegue futuro.
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: target/auth-service-*.jar
          retention-days: 14


  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 – QA: Análisis estático con SonarQube / SonarCloud
  #
  # Solo se ejecuta en PUSH directo (no en Pull Requests) para evitar que
  # los secrets de Sonar queden expuestos a forks externos.
  # Depende de build-and-test para garantizar que el JAR y los reportes
  # de cobertura están generados antes de iniciar el análisis.
  #
  # Secrets requeridos en el repositorio:
  #   SONAR_TOKEN    → token de autenticación de SonarQube/SonarCloud
  #   SONAR_HOST_URL → URL del servidor (ej: https://sonarcloud.io)
  # ═══════════════════════════════════════════════════════════════════════════
  sonar-analysis:
    name: "QA – SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout source code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Sonar necesita los .class compilados (target/classes) y el reporte
      # JaCoCo XML (target/site/jacoco/jacoco.xml) para calcular cobertura.
      # Los artefactos del Job 1 no se comparten entre jobs, por eso
      # volvemos a ejecutar verify aquí (el caché Maven lo hace rápido).
      - name: Rebuild to generate bytecode and JaCoCo XML
        env:
          MONGO_URI:              ${{ secrets.MONGO_URI_TEST }}
          JWT_SECRET:             ${{ secrets.JWT_SECRET_TEST }}
          JWT_EXPIRATION:         '900000'
          MAIL_DEV_MODE:          'true'
          MAIL_USERNAME:          'ci-noreply@example.com'
          MAIL_PASSWORD:          'dummy-ci-password'
          SPRING_PROFILES_ACTIVE: dev
        run: mvn clean verify -B

      # ── Análisis SonarQube ────────────────────────────────────────────────
      #
      # Parámetros adaptados a Arquitectura Hexagonal (Ports & Adapters):
      #
      # sonar.coverage.exclusions
      #   Las interfaces de los Ports (domain/ports/in y domain/ports/out)
      #   son contratos por diseño; su implementación está en Infrastructure.
      #   Sin esta exclusión Sonar reportaría 0% de cobertura en ellas como
      #   falso positivo. También se excluyen los DTOs de request, que no
      #   contienen lógica de negocio.
      #
      # sonar.cpd.exclusions (Copy-Paste Detection)
      #   Los mappers de MapStruct, los DTOs y las entities de persistencia
      #   son estructuralmente similares por diseño de la capa.
      #   Excluirlos evita cientos de alertas de "código duplicado" espurias.
      #
      # sonar.issue.ignore.multicriteria → regla S2094 ("empty interface")
      #   Los output ports pueden ser interfaces vacías que extienden
      #   MongoRepository<T, ID>. Sonar las marcaría como code smell,
      #   pero es un patrón válido en Arquitectura Hexagonal.
      #
      # sonar.organization (solo SonarCloud)
      #   Descomenta y ajusta si usas SonarCloud en lugar de SonarQube
      #   auto-hospedado. Para SonarQube on-premise esta línea se ignora.
      - name: Run SonarQube / SonarCloud analysis
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar -B \
            -Dsonar.projectKey=patricia \
            -Dsonar.projectName="patricia" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.test.binaries=target/test-classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.coverage.exclusions="\
              **/domain/ports/**,\
              **/application/dto/**,\
              **/entrypoints/rest/request/**,\
              **/*Application.java" \
            -Dsonar.cpd.exclusions="\
              **/dto/**,\
              **/mapper/**,\
              **/entity/**,\
              **/valueobjects/**" \
            -Dsonar.issue.ignore.multicriteria=hexPort \
            -Dsonar.issue.ignore.multicriteria.hexPort.ruleKey=java:S2094 \
            -Dsonar.issue.ignore.multicriteria.hexPort.resourceKey="**/domain/ports/**"


  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 – Docker: Construir y publicar la imagen de contenedor
  #
  # Solo se ejecuta en PUSH a la rama main (imagen de producción).
  # Usa GitHub Container Registry (ghcr.io). Para usar Docker Hub,
  # sustituye registry por docker.io y los secrets correspondientes.
  #
  # La caché de BuildKit (type=gha) reutiliza capas entre builds,
  # reduciendo el tiempo de construcción cuando solo cambia el JAR.
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build-push:
    name: "Docker – Build & Push Image"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Permiso de escritura en packages necesario para push a ghcr.io
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Buildx activa BuildKit (multi-platform, caché avanzada, secrets)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autenticación con GitHub Container Registry usando el token automático
      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera tags semánticos automáticamente:
      #   latest    → solo en rama main
      #   sha-<git> → commit exacto, inmutable, útil para rollback
      #   main      → nombre de la rama
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      # Construye la imagen usando el Dockerfile multi-stage del proyecto.
      # push: true sube la imagen al registry solo en builds de main.
      # cache-from/cache-to reutiliza capas de builds anteriores (GitHub Cache).
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
